
name: TaskFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required files
        run: |
          test -f index.html
          test -f script.js
          test -f style.css
          echo "Required files exist"

      - name: Run automated tests
        run: npm test
